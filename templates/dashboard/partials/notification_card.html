<!-- dashboard/partials/_reservation_card.html -->
<div class="card shadow-sm mb-2" style="border-left: 4px solid {{ border_color }};">
    <div class="card-body py-2 d-flex flex-column flex-md-row justify-content-between align-items-md-center">
        <div>
            <strong>{{ reservation.name|title }}</strong>
            <span class="badge badge-secondary ml-2">Site {{ reservation.site }}</span>
            <div class="text-muted small mt-1">
                {{ date_label }}: {{ date_value|date:"D, M d Y" }} at {{ date_value|time:"g:i A" }}
            </div>
        </div>
        <div class="d-flex mt-2 mt-md-0">
            <a href="tel:{{ reservation.phoneNum }}" class="btn btn-sm btn-outline-secondary mr-2 flex-fill flex-md-grow-0">📞 Call</a>
            <a href="{% url 'reservation-detail' reservation.id %}" class="btn btn-sm btn-outline-primary mr-2 flex-fill flex-md-grow-0">View</a>
            {% if show_checkout %}
            <form method="POST" action="{% url 'reservation-checkout' reservation.id %}" style="display: inline;" class="checkout-form">
                {% csrf_token %}
                <button type="submit" class="btn btn-sm btn-success flex-fill flex-md-grow-0">✓ Checkout</button>
            </form>
            {% endif %}
        </div>
    </div>
</div>
