{% extends "base.html" %}
{% load static crispy_forms_tags %}

{% block content %}
<section class="container py-4">

    <!-- Back -->
    <a href="{% url 'list-reservation' %}" class="btn btn-secondary btn-sm mb-3">← Back to Reservations</a>

    <!-- Header -->
    <div class="mb-4">
        <h1 class="h3 mb-1">New Reservation</h1>
        <p class="text-muted small mb-0">Fill in the details to create a new reservation.</p>
    </div>

    <!-- Form -->
    <div class="row">
        <div class="col-sm-12 col-lg-8 offset-lg-2">
            <div class="card shadow-sm">
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        {% crispy form form.helper %}
                        <div class="mt-3 d-flex justify-content-between">
                            <button type="submit" class="btn btn-primary">Create Reservation</button>
                            <a href="{% url 'list-reservation' %}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</section>
{% endblock %}
